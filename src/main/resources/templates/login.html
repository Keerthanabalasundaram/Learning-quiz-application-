<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Sign In')">
</head>
<body class="flex items-center justify-center min-h-screen bg-[#070a13] text-gray-100 font-sans px-4">

    <div class="w-full max-w-md">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center p-3 bg-indigo-500/10 border border-indigo-500/20 rounded-2xl mb-3 shadow-lg">
                <i data-lucide="graduation-cap" class="w-10 h-10 text-indigo-500 stroke-[2.5]"></i>
            </div>
            <h1 class="text-3xl font-extrabold font-outfit gradient-text">Learning Quiz Application</h1>
            <p class="text-gray-400 text-sm mt-1">Gamified Adaptive MCQ Learning Platform</p>
        </div>

        <!-- Glass card container -->
        <div class="bg-slate-900/60 backdrop-blur-md border-white/10 p-8 rounded-2xl shadow-2xl">
            <!-- Alerts -->
            <div th:if="${param.registered}" class="mb-5 bg-green-500/10 border-green-500/20 text-green-400 p-3.5 rounded-xl flex items-center gap-2 text-xs">
                <i data-lucide="check-circle" class="w-4 h-4 text-green-500 flex-shrink-0"></i>
                <span>Registration successful! Please login.</span>
            </div>

            <div th:if="${successMessage}" class="mb-5 bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 p-3.5 rounded-xl flex items-center gap-2 text-xs" th:text="${successMessage}">
            </div>

            <div th:if="${errorMessage}" class="mb-5 bg-red-500/10 border-red-500/20 text-red-400 p-3.5 rounded-xl flex items-center gap-2 text-xs" th:text="${errorMessage}">
            </div>

            <form th:action="@{/login}" method="POST" class="space-y-5">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <!-- Username -->
                <div>
                    <label for="usernameInput" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                            <i data-lucide="user" class="w-4.5 h-4.5"></i>
                        </div>
                        <input type="text" name="username" id="usernameInput" 
                               class="block w-full bg-slate-950/60 border-white/10 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" 
                               placeholder="Enter your username" required autocomplete="off">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label for="passwordInput" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                            <i data-lucide="lock" class="w-4.5 h-4.5"></i>
                        </div>
                        <input type="password" name="password" id="passwordInput" 
                               class="block w-full bg-slate-950/60 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" 
                               placeholder="Enter your password" required>
                    </div>
                </div>

                <!-- Remember Me Box -->
                <div class="flex items-center">
                    <input type="checkbox" name="remember-me" id="rememberMeInput" class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 bg-slate-950/60 border-white/10">
                    <label for="rememberMeInput" class="ml-2 block text-sm text-gray-400 cursor-pointer select-none">Remember my session</label>
                </div>

                <!-- Submit -->
                <button type="submit" class="w-full inline-flex items-center justify-center px-6 py-3 border-transparent rounded-xl text-sm font-semibold text-white gradient-btn transition duration-150 gap-2 mt-2">
                    <i data-lucide="log-in" class="w-4.5 h-4.5"></i>
                    <span>Sign In</span>
                </button>
            </form>

            <!-- Sign Up Link -->
            <div class="mt-6 text-center text-sm border-t border-white/5 pt-5">
                <span class="text-gray-500">Don't have an account? </span>
                <a th:href="@{/register}" class="text-indigo-400 hover:text-indigo-300 font-semibold transition duration-150">Sign Up</a>
            </div>

            <!-- Default Credentials Note -->
            <div class="mt-4 border-t border-white/5 pt-5 text-center">
                <div class="bg-indigo-500/5 border border-indigo-500/10 rounded-xl p-3.5 text-xs text-gray-400">
                    <span class="font-semibold text-gray-300 block mb-1">Testing Credentials</span>
                    Username: <code class="text-indigo-300">admin</code> &bull; Password: <code class="text-indigo-300">password</code>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Ensure Lucide icons load correctly
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
