<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Sign Up')">
</head>
<body class="flex items-center justify-center min-h-screen bg-[#070a13] text-gray-100 font-sans px-4">

    <div class="w-full max-w-md">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center p-3 bg-indigo-500/10 border border-indigo-500/20 rounded-2xl mb-3 shadow-lg">
                <i data-lucide="graduation-cap" class="w-10 h-10 text-indigo-500 stroke-[2.5]"></i>
            </div>
            <h1 class="text-3xl font-extrabold font-outfit gradient-text">Learning Quiz Application</h1>
            <p class="text-gray-400 text-sm mt-1">Create your student account</p>
        </div>

        <!-- Glass card container -->
        <div class="bg-slate-900/60 backdrop-blur-md border border-white/10 p-8 rounded-2xl shadow-2xl">
            <!-- Error Alert -->
            <div th:if="${errorMessage}" class="mb-5 bg-red-500/10 border border-red-500/20 text-red-400 p-3.5 rounded-xl flex items-center gap-2 text-xs" th:text="${errorMessage}">
            </div>

            <form th:action="@{/register}" method="POST" class="space-y-5">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <!-- Username -->
                <div>
                    <label for="usernameInput" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                            <i data-lucide="user" class="w-4.5 h-4.5"></i>
                        </div>
                        <input type="text" name="username" id="usernameInput" 
                               class="block w-full bg-slate-950/60 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" 
                               placeholder="Choose a username" required autocomplete="off">
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label for="emailInput" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                            <i data-lucide="mail" class="w-4.5 h-4.5"></i>
                        </div>
                        <input type="email" name="email" id="emailInput" 
                               class="block w-full bg-slate-950/60 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" 
                               placeholder="Enter your email" required autocomplete="off">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label for="passwordInput" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                            <i data-lucide="lock" class="w-4.5 h-4.5"></i>
                        </div>
                        <input type="password" name="password" id="passwordInput" 
                               class="block w-full bg-slate-950/60 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" 
                               placeholder="Create a password" required>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="w-full inline-flex items-center justify-center px-6 py-3 border border-transparent rounded-xl text-sm font-semibold text-white gradient-btn transition duration-150 gap-2 mt-2">
                    <i data-lucide="user-plus" class="w-4.5 h-4.5"></i>
                    <span>Register Account</span>
                </button>
            </form>

            <!-- Signin Redirect -->
            <div class="mt-6 text-center text-sm border-t border-white/5 pt-5">
                <span class="text-gray-500">Already have an account? </span>
                <a th:href="@{/login}" class="text-indigo-400 hover:text-indigo-300 font-semibold transition duration-150">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        // Ensure Lucide icons load correctly
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
