# src/main/resources/application.properties
# ========================================
# Learning Quiz App - Configuration
# ========================================

# Active Profile: H2 (default for local zero-setup) or MySQL
spring.profiles.active=h2

# Spring MVC & Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.suffix=.html
spring.thymeleaf.prefix=classpath:/templates/

# Multipart File Upload Configurations (CSV / Study notes limits)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Chatbot Tutor Configuration
# Set your OpenAI API key here to switch from offline simulation to live AI responses!
app.openai.api-key=none
app.openai.model=gpt-4o-mini
app.gemini.api-key=none

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false