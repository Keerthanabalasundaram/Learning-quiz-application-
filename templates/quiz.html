<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Quiz Active')">
</head>
<body class="flex flex-col min-h-screen bg-[#070a13] text-gray-100 font-sans">

    <!-- Shared Navigation -->
    <div th:replace="layout :: navbar"></div>

    <!-- Global Quiz Timer Bar -->
    <div class="w-full bg-white/5 h-1.5 overflow-hidden">
        <div id="globalTimerProgress" class="bg-indigo-500 h-1.5 shadow-[0_0_10px_rgba(99,102,241,0.6)]" style="width: 100%"></div>
    </div>

    <!-- Hidden global timer configuration fields for JS -->
    <input type="hidden" id="globalRemainingSeconds" th:value="${globalRemainingSeconds}">
    <input type="hidden" id="questionLimitSeconds" th:value="${questionLimitSeconds}">

    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        <div class="space-y-6">
            
            <!-- Active Quiz Header Info -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-slate-900/40 border border-white/5 p-5 rounded-2xl">
                <div>
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 mb-1.5" 
                          th:text="'Level ' + ${state.levelNumber} + ' / Unit ' + ${state.unitId}">LEVEL 1 / UNIT 1</span>
                    <h2 class="text-xl font-bold font-outfit text-white" th:text="${question.unit.name}">Unit Name</h2>
                </div>
                
                <div class="flex items-center justify-between sm:justify-end gap-4">
                    <!-- Difficulty status -->
                    <span class="px-3 py-1.5 rounded-lg border text-xs font-bold uppercase"
                          th:classappend="${state.currentDifficulty == 'EASY' ? 'bg-green-500/10 text-green-400 border-green-500/20' : (state.currentDifficulty == 'HARD' ? 'bg-red-500/10 text-red-400 border-red-500/20 animate-pulse' : 'bg-yellow-500/10 text-yellow-500 border-yellow-500/20')}"
                          th:text="${state.currentDifficulty}">
                        MEDIUM
                    </span>
                    
                    <!-- Question Countdown Circle -->
                    <div class="timer-container">
                        <svg class="timer-svg" width="80" height="80">
                            <circle class="timer-circle-bg" cx="40" cy="40" r="35"></circle>
                            <circle class="timer-circle-fg" cx="40" cy="40" r="35"></circle>
                        </svg>
                        <div class="timer-text" th:text="${questionLimitSeconds}">45</div>
                    </div>
                </div>
            </div>

            <!-- Progress indicators -->
            <div class="space-y-2">
                <div class="flex justify-between items-center text-xs text-gray-400">
                    <span>Question <strong class="text-white" th:text="${state.currentQuestionIndex + 1}">1</strong> of <strong class="text-white" th:text="${state.totalQuestionsLimit}">10</strong></span>
                    <span th:text="${(state.currentQuestionIndex * 100) / state.totalQuestionsLimit} + '% Complete'">10% Complete</span>
                </div>
                <div class="w-full bg-white/5 h-1 rounded-full overflow-hidden">
                    <div class="bg-indigo-500 h-1 rounded-full" th:style="'width: ' + ${(state.currentQuestionIndex * 100) / state.totalQuestionsLimit} + '%'"></div>
                </div>
            </div>

            <!-- Quiz Main Form Card -->
            <div class="bg-slate-900/60 backdrop-blur-md border border-white/10 p-6 sm:p-8 rounded-2xl shadow-xl">
                <form id="quizForm" th:action="@{/quiz/submit}" method="POST">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    
                    <!-- Question -->
                    <h3 class="text-xl sm:text-2xl font-semibold font-outfit text-white leading-relaxed mb-8" th:text="${question.questionText}">
                        What is the correct syntax to declare an array in Java?
                    </h3>

                    <!-- Hidden Option Field -->
                    <input type="hidden" name="selectedOption" id="selectedOptionInput" value="">

                    <!-- Options Container -->
                    <div class="space-y-4">
                        <!-- Option A -->
                        <button type="button" class="btn-glass-option flex items-center w-full px-5 py-4 bg-white/5 border border-white/10 hover:border-indigo-500/30 hover:bg-white/[0.07] rounded-xl text-left text-gray-200 hover:text-white transition duration-150 group" data-option="A">
                            <span class="inline-flex items-center justify-center w-6 h-6 bg-slate-950 border border-white/10 rounded-md text-xs font-semibold text-gray-400 group-hover:border-indigo-500/30 mr-4 flex-shrink-0">A</span>
                            <span th:text="${question.optionA}">Option A</span>
                        </button>
                        
                        <!-- Option B -->
                        <button type="button" class="btn-glass-option flex items-center w-full px-5 py-4 bg-white/5 border border-white/10 hover:border-indigo-500/30 hover:bg-white/[0.07] rounded-xl text-left text-gray-200 hover:text-white transition duration-150 group" data-option="B">
                            <span class="inline-flex items-center justify-center w-6 h-6 bg-slate-950 border border-white/10 rounded-md text-xs font-semibold text-gray-400 group-hover:border-indigo-500/30 mr-4 flex-shrink-0">B</span>
                            <span th:text="${question.optionB}">Option B</span>
                        </button>
                        
                        <!-- Option C -->
                        <button type="button" class="btn-glass-option flex items-center w-full px-5 py-4 bg-white/5 border border-white/10 hover:border-indigo-500/30 hover:bg-white/[0.07] rounded-xl text-left text-gray-200 hover:text-white transition duration-150 group" data-option="C">
                            <span class="inline-flex items-center justify-center w-6 h-6 bg-slate-950 border border-white/10 rounded-md text-xs font-semibold text-gray-400 group-hover:border-indigo-500/30 mr-4 flex-shrink-0">C</span>
                            <span th:text="${question.optionC}">Option C</span>
                        </button>
                        
                        <!-- Option D -->
                        <button type="button" class="btn-glass-option flex items-center w-full px-5 py-4 bg-white/5 border border-white/10 hover:border-indigo-500/30 hover:bg-white/[0.07] rounded-xl text-left text-gray-200 hover:text-white transition duration-150 group" data-option="D">
                            <span class="inline-flex items-center justify-center w-6 h-6 bg-slate-950 border border-white/10 rounded-md text-xs font-semibold text-gray-400 group-hover:border-indigo-500/30 mr-4 flex-shrink-0">D</span>
                            <span th:text="${question.optionD}">Option D</span>
                        </button>
                    </div>

                    <!-- Footer and Controls -->
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mt-8 pt-6 border-t border-white/10">
                        <span class="text-xs text-gray-500 flex items-center gap-1.5">
                            <i data-lucide="bot" class="w-4 h-4 text-indigo-500"></i> Need assistance? Query the Chatbot Tutor on the right.
                        </span>
                        
                        <button type="submit" class="inline-flex items-center justify-center px-6 py-3 border border-transparent rounded-xl text-sm font-semibold text-white gradient-btn transition duration-150 gap-1.5 self-end">
                            Next Question <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </main>

    <!-- Floating Chatbot Widget Shared Fragment -->
    <div th:replace="layout :: chatbot"></div>
    <div th:replace="layout :: footer"></div>

</body>
</html>
