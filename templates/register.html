<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Register')">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container" style="max-width: 440px;">
        <div class="glass-card p-5 text-center">
            
            <div class="mb-4">
                <i class="fa-solid fa-user-plus fs-1 text-primary mb-2"></i>
                <h2 class="brand-font mb-1">Create Account</h2>
                <p class="text-muted small">Join and start adaptive learning paths</p>
            </div>

            <!-- Error Alerts -->
            <div th:if="${errorMessage}" class="alert alert-danger bg-danger bg-opacity-10 text-danger border-danger-subtle py-2 small" role="alert" th:text="${errorMessage}">
            </div>

            <form th:action="@{/register}" method="POST">
                <div class="form-floating mb-3">
                    <input type="text" name="username" class="form-control bg-dark border-secondary text-white" id="usernameInput" placeholder="username" required autocomplete="off">
                    <label for="usernameInput" class="text-white-50">Username</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" name="email" class="form-control bg-dark border-secondary text-white" id="emailInput" placeholder="name@example.com" required autocomplete="off">
                    <label for="emailInput" class="text-white-50">Email Address</label>
                </div>
                
                <div class="form-floating mb-4">
                    <input type="password" name="password" class="form-control bg-dark border-secondary text-white" id="passwordInput" placeholder="Password" required>
                    <label for="passwordInput" class="text-white-50">Password</label>
                </div>

                <button type="submit" class="btn btn-primary-glow w-100 py-3 mb-3">
                    <i class="fa-solid fa-user-check me-2"></i> Sign Up
                </button>
            </form>

            <div class="mt-4">
                <p class="text-muted small mb-0">Already have an account? 
                    <a th:href="@{/login}" class="text-primary text-decoration-none fw-semibold">Sign In</a>
                </p>
            </div>

        </div>
    </div>

</body>
</html>
