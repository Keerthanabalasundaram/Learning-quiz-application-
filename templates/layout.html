<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSRF Meta Tags for AJAX calls (Security compatibility) -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    
    <title th:text="${title} + ' - Learning Quiz App'"></title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Glassmorphic Dark-Theme CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

    <!-- 1. Shared Navigation Bar -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-transparent border-bottom border-secondary-subtle">
        <div class="container py-2">
            <a class="navbar-brand brand-font" th:href="@{/dashboard}">
                <i class="fa-solid fa-graduation-cap me-2"></i>Learning Quiz App
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link px-3" th:href="@{/dashboard}">
                            <i class="fa-solid fa-gauge me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" th:href="@{/upload}">
                            <i class="fa-solid fa-cloud-arrow-up me-1"></i> Study Material
                        </a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <span class="text-white-50 me-2" sec:authorize="isAuthenticated()">
                            <i class="fa-solid fa-user me-1 text-primary"></i> <span sec:authentication="name">User</span>
                        </span>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="fa-solid fa-right-from-bracket"></i> Logout
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 2. Chatbot Tutor widget (available everywhere) -->
    <div th:fragment="chatbot" sec:authorize="isAuthenticated()">
        <!-- Floating Toggle Button -->
        <div class="chatbot-widget-container">
            <button id="chatToggleBtn" class="chat-toggle-btn" title="Open Tutor Chat">
                <i class="fa-solid fa-robot"></i>
            </button>
        </div>

        <!-- Tutor Chat Sidebar Panel -->
        <div id="chatPanel" class="chat-panel glass-card">
            <div class="chat-header">
                <div class="d-flex align-items-center">
                    <i class="fa-solid fa-robot me-2 fs-5"></i>
                    <div>
                        <h6 class="mb-0 brand-font">Chatbot Tutor</h6>
                        <small style="font-size: 0.75rem; opacity: 0.8;">Active Guided Tutor</small>
                    </div>
                </div>
                <button id="closeChatBtn" class="btn-close btn-close-white" aria-label="Close"></button>
            </div>
            
            <div id="chatBody" class="chat-body">
                <div class="text-center text-muted py-5">
                    <i class="fa-solid fa-spinner fa-spin fs-4 mb-2"></i>
                    <p class="mb-0 small">Loading chat history...</p>
                </div>
            </div>
            
            <div class="chat-footer">
                <div class="input-group">
                    <input type="text" id="chatInput" class="form-control chat-input" placeholder="Ask a hint or concept..." autocomplete="off">
                    <button id="sendChatBtn" class="btn btn-primary-glow px-3" type="button">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Chatbot and Core JavaScripts -->
        <script th:src="@{/js/chatbot.js}"></script>
        <script th:src="@{/js/app.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </div>

</body>
</html>
