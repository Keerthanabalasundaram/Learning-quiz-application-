<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Quiz Results')">
</head>
<body class="flex flex-col min-h-screen bg-[#070a13] text-gray-100 font-sans">

    <!-- Shared Navigation -->
    <div th:replace="layout :: navbar"></div>

    <main class="flex-grow container mx-auto px-4 py-12 max-w-2xl">
        <div class="bg-slate-900/60 backdrop-blur-md border border-white/10 p-8 sm:p-10 rounded-2xl shadow-xl text-center space-y-6">
            
            <!-- Feedback Icon / Badges -->
            <div class="space-y-4">
                <div th:if="${result.passed}">
                    <div class="feedback-animation text-6xl">🎉</div>
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-green-500/15 text-green-400 border border-green-500/20 uppercase tracking-wide">
                        <i data-lucide="check" class="w-3.5 h-3.5 mr-1"></i> Level Cleared
                    </span>
                </div>
                <div th:unless="${result.passed}">
                    <div class="feedback-animation text-6xl">💪</div>
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-red-500/15 text-red-400 border border-red-500/20 uppercase tracking-wide">
                        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 mr-1"></i> Retry Level
                    </span>
                </div>

                <h1 class="text-2xl sm:text-3xl font-extrabold font-outfit text-white leading-tight" th:text="${unitName}">Unit Title</h1>
                <p class="text-gray-400 text-sm max-w-md mx-auto leading-relaxed" th:text="${result.feedbackMessage}">Congratulations! You cleared this level.</p>
            </div>

            <hr class="border-white/10 my-6">

            <!-- Stats grid -->
            <div class="grid grid-cols-3 gap-4">
                <!-- Score -->
                <div class="bg-slate-950/60 border border-white/5 p-4 rounded-xl">
                    <span class="text-xs text-gray-500 font-medium block mb-1">Score</span>
                    <h3 class="text-xl sm:text-2xl font-bold font-outfit text-white">
                        <span th:text="${result.score}">0</span> / <span th:text="${result.totalQuestions}">10</span>
                    </h3>
                </div>

                <!-- Accuracy -->
                <div class="bg-slate-950/60 border border-white/5 p-4 rounded-xl">
                    <span class="text-xs text-gray-500 font-medium block mb-1">Accuracy</span>
                    <h3 class="text-xl sm:text-2xl font-bold font-outfit" th:classappend="${result.passed ? 'text-green-400' : 'text-red-400'}" th:text="${result.accuracyPercentage} + '%'">0%</h3>
                </div>

                <!-- Time Spent -->
                <div class="bg-slate-950/60 border border-white/5 p-4 rounded-xl">
                    <span class="text-xs text-gray-500 font-medium block mb-1">Time Taken</span>
                    <h3 class="text-xl sm:text-2xl font-bold font-outfit text-cyan-400" th:text="${result.timeTakenSeconds} + 's'">0s</h3>
                </div>
            </div>

            <!-- Navigation Controls -->
            <div class="flex flex-col sm:flex-row justify-center gap-4 pt-6">
                <a th:href="@{/dashboard}" class="inline-flex items-center justify-center px-6 py-3 border border-transparent rounded-xl text-sm font-semibold text-white gradient-btn transition duration-150 gap-1.5">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Go to Dashboard
                </a>
                
                <a th:href="@{/quiz/start(unitId=${result.quiz.unit.id})}" class="inline-flex items-center justify-center px-6 py-3 border border-white/10 hover:border-white/20 rounded-xl text-sm font-semibold text-gray-300 hover:text-white hover:bg-white/5 transition duration-150 gap-1.5">
                    <i data-lucide="rotate-cw" class="w-4 h-4"></i> Try Again
                </a>
            </div>

        </div>
    </main>

    <!-- Floating Chatbot Widget Shared Fragment -->
    <div th:replace="layout :: chatbot"></div>
    <div th:replace="layout :: footer"></div>

</body>
</html>
