<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Quiz Results')">
</head>
<body>

    <!-- Shared Navigation -->
    <div th:replace="layout :: navbar"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            
            <div class="col-lg-6">
                
                <div class="glass-card p-5 text-center">
                    
                    <!-- Pass/Fail State Visuals -->
                    <div th:if="${result.passed}">
                        <div class="feedback-animation">🎉</div>
                        <span class="badge bg-success bg-opacity-10 text-success border border-success px-3 py-2 rounded mb-3 fs-6">LEVEL CLEARED</span>
                    </div>
                    <div th:unless="${result.passed}">
                        <div class="feedback-animation">💪</div>
                        <span class="badge bg-danger bg-opacity-10 text-danger border border-danger px-3 py-2 rounded mb-3 fs-6">RETRY LEVEL</span>
                    </div>

                    <h2 class="brand-font text-white mb-2" th:text="${unitName}">Unit Title</h2>
                    
                    <!-- Feedback Message -->
                    <p class="text-white-50 px-4 mb-4" th:text="${result.feedbackMessage}">Congratulations! You unlocked the next level.</p>

                    <hr class="border-secondary opacity-25 my-4">

                    <!-- Score Stats Grid -->
                    <div class="row g-3 mb-5">
                        <div class="col-4">
                            <div class="bg-dark bg-opacity-40 p-3 rounded border border-secondary border-opacity-30">
                                <span class="text-muted small d-block mb-1">Score</span>
                                <h4 class="mb-0 text-white brand-font"><span th:text="${result.score}">0</span> / <span th:text="${result.totalQuestions}">10</span></h4>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="bg-dark bg-opacity-40 p-3 rounded border border-secondary border-opacity-30">
                                <span class="text-muted small d-block mb-1">Accuracy</span>
                                <h4 class="mb-0 brand-font" th:classappend="${result.passed ? 'text-success' : 'text-danger'}" th:text="${result.accuracyPercentage} + '%'">0%</h4>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="bg-dark bg-opacity-40 p-3 rounded border border-secondary border-opacity-30">
                                <span class="text-muted small d-block mb-1">Time taken</span>
                                <h4 class="mb-0 text-info brand-font" th:text="${result.timeTakenSeconds} + 's'">0s</h4>
                            </div>
                        </div>
                    </div>

                    <!-- Navigation Action Controls -->
                    <div class="d-flex justify-content-center gap-3">
                        <a th:href="@{/dashboard}" class="btn btn-primary-glow px-4 py-3">
                            <i class="fa-solid fa-gauge me-1"></i> Go to Dashboard
                        </a>
                        
                        <a th:href="@{/quiz/start(unitId=${result.quiz.unit.id})}" class="btn btn-outline-light px-4 py-3">
                            <i class="fa-solid fa-redo me-1"></i> Try Again
                        </a>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <!-- Floating Chatbot Widget Shared Fragment -->
    <div th:replace="layout :: chatbot"></div>

</body>
</html>
