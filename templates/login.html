<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Login')">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container" style="max-width: 420px;">
        <div class="glass-card p-5 text-center">
            
            <div class="mb-4">
                <i class="fa-solid fa-graduation-cap fs-1 text-primary mb-2"></i>
                <h2 class="brand-font mb-1">Learning Quiz App</h2>
                <p class="text-muted small">Gamified Adaptive MCQ Learning Platform</p>
            </div>

            <!-- Registration Success Alert -->
            <div th:if="${param.registered}" class="alert alert-success bg-success bg-opacity-10 text-success border-success-subtle py-2 small" role="alert">
                Registration successful! Please login.
            </div>

            <!-- Logout Success Alert -->
            <div th:if="${successMessage}" class="alert alert-info bg-info bg-opacity-10 text-info border-info-subtle py-2 small" role="alert" th:text="${successMessage}">
            </div>

            <!-- Login Error Alert -->
            <div th:if="${errorMessage}" class="alert alert-danger bg-danger bg-opacity-10 text-danger border-danger-subtle py-2 small" role="alert" th:text="${errorMessage}">
            </div>

            <form th:action="@{/login}" method="POST">
                <div class="form-floating mb-3">
                    <input type="text" name="username" class="form-control bg-dark border-secondary text-white" id="usernameInput" placeholder="username" required autocomplete="off">
                    <label for="usernameInput" class="text-white-50">Username</label>
                </div>
                
                <div class="form-floating mb-4">
                    <input type="password" name="password" class="form-control bg-dark border-secondary text-white" id="passwordInput" placeholder="Password" required>
                    <label for="passwordInput" class="text-white-50">Password</label>
                </div>

                <button type="submit" class="btn btn-primary-glow w-100 py-3 mb-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
                </button>
            </form>

            <div class="mt-4">
                <p class="text-muted small mb-0">Don't have an account? 
                    <a th:href="@{/register}" class="text-primary text-decoration-none fw-semibold">Sign Up</a>
                </p>
            </div>

        </div>
    </div>

</body>
</html>
